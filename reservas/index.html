<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reservas · Check-inn Saltillo</title>
<meta name="description" content="Consulta disponibilidad y precios de nuestros alojamientos en Saltillo.">
<style>
  :root{--rsv-primary:#0f766e;--rsv-primary-dark:#134e4a;--rsv-accent:#f59e0b;--rsv-ink:#0f172a;--rsv-muted:#64748b;--rsv-line:#e2e8f0;--rsv-bg:#f8fafc;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;color:var(--rsv-ink);background:var(--rsv-bg)}
  .rsv-topbar{background:#fff;border-bottom:1px solid var(--rsv-line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .rsv-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;color:var(--rsv-ink);text-decoration:none}
  .rsv-brand-icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--rsv-accent),#ea580c);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
  .rsv-topbar a.rsv-back{font-size:13px;font-weight:600;color:var(--rsv-muted);text-decoration:none}
  .rsv-topbar a.rsv-back:hover{color:var(--rsv-primary)}
  #rsv-shell{min-height:calc(100vh - 55px);padding:0 0 60px}
  .rsv-hero{background:transparent;color:#0f172a;padding:32px 24px 20px;position:relative;overflow:hidden}
  .rsv-hero-title{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;position:relative;z-index:1;color:#0f172a}
  .rsv-hero-sub{font-size:14px;color:#64748b;max-width:640px;position:relative;z-index:1;margin:0;font-weight:500}
  .rsv-searchbar{position:relative;z-index:2;max-width:1080px;margin:24px auto 0;background:#fff;border-radius:16px;box-shadow:0 8px 24px -8px rgba(15,23,42,.12),0 2px 6px rgba(15,23,42,.05);border:1px solid #e2e8f0;padding:14px;display:grid;grid-template-columns:1fr 1fr .8fr auto;gap:8px;align-items:stretch}
  @media (max-width:820px){.rsv-searchbar{grid-template-columns:1fr;padding:12px}.rsv-hero{padding:24px 16px 16px}.rsv-hero-title{font-size:26px}}
  .rsv-field{display:flex;flex-direction:column;padding:8px 12px;border-radius:10px;border:1px solid transparent;transition:all .18s}
  .rsv-field:hover{background:#f8fafc}
  .rsv-field:focus-within{background:#f0fdfa;border-color:var(--rsv-primary)}
  .rsv-field label{font-size:10px;font-weight:800;color:var(--rsv-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
  .rsv-field input,.rsv-field select{border:0;outline:0;background:transparent;font-size:14px;font-weight:700;color:var(--rsv-ink);padding:2px 0;font-family:inherit;width:100%}
  .rsv-search-btn{background:linear-gradient(135deg,var(--rsv-accent),#ea580c);color:#fff;border:0;border-radius:10px;padding:0 22px;font-size:14px;font-weight:800;cursor:pointer;transition:transform .12s,box-shadow .12s;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:6px;min-height:56px}
  .rsv-search-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -4px rgba(245,158,11,.5)}
  .rsv-toolbar{max-width:1080px;margin:24px auto 0;padding:0 24px;display:flex;justify-content:flex-start;align-items:center;gap:12px;flex-wrap:wrap}
  .rsv-count{font-size:14px;font-weight:800;color:var(--rsv-ink)}
  .rsv-count small{color:var(--rsv-muted);font-weight:600;margin-left:6px}
  .rsv-float-bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:8500;display:none;align-items:center;gap:10px}
  .rsv-float-bar.visible{display:inline-flex}
  .rsv-map-btn-float{align-items:center;gap:8px;padding:12px 22px;background:var(--rsv-ink);color:#fff;border:0;border-radius:99px;font-size:14px;font-weight:800;cursor:pointer;transition:all .18s;box-shadow:0 10px 30px -4px rgba(15,23,42,.4),0 4px 10px rgba(15,23,42,.15);letter-spacing:.01em;display:inline-flex}
  .rsv-map-btn-float:hover{background:var(--rsv-primary);transform:translateY(-2px);box-shadow:0 16px 40px -6px rgba(15,118,110,.45),0 6px 14px rgba(15,23,42,.2)}
  .rsv-share-btn-float{align-items:center;gap:8px;padding:12px 22px;background:#fff;color:var(--rsv-ink);border:1px solid #e5e7eb;border-radius:99px;font-size:14px;font-weight:800;cursor:pointer;transition:all .18s;box-shadow:0 10px 30px -4px rgba(15,23,42,.25),0 4px 10px rgba(15,23,42,.1);letter-spacing:.01em;display:inline-flex}
  .rsv-share-btn-float:hover{border-color:var(--rsv-accent);color:var(--rsv-accent);transform:translateY(-2px);box-shadow:0 16px 40px -6px rgba(15,118,110,.35),0 6px 14px rgba(15,23,42,.15)}
  .rsv-share-btn-float.copied{background:#10b981;border-color:#10b981;color:#fff}
  .rsv-grid{max-width:1080px;margin:20px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
  .rsv-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.06);border:1px solid var(--rsv-line);cursor:pointer;transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s;display:flex;flex-direction:column}
  .rsv-card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -10px rgba(15,23,42,.15),0 4px 8px rgba(15,23,42,.05)}
  .rsv-card-img{aspect-ratio:16/10;background:linear-gradient(135deg,#e2e8f0,#cbd5e1);position:relative;overflow:hidden}
  .rsv-card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .rsv-card:hover .rsv-card-img img{transform:scale(1.05)}
  .rsv-card-type{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:var(--rsv-primary-dark);font-size:10px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(6px)}
  .rsv-card-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
  .rsv-card-title{font-size:15px;font-weight:800;color:var(--rsv-ink);line-height:1.3;margin:0 0 4px;letter-spacing:-.01em}
  .rsv-card-loc{font-size:12px;color:var(--rsv-muted);margin:0 0 10px}
  .rsv-card-cap{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:#475569;font-weight:600;margin-bottom:10px}
  .rsv-card-cap span{display:inline-flex;align-items:center;gap:3px}
  .rsv-card-amen{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
  .rsv-card-amen span{font-size:10px;background:#f1f5f9;color:#475569;padding:3px 8px;border-radius:99px;font-weight:600}
  .rsv-card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-top:10px;border-top:1px dashed var(--rsv-line)}
  .rsv-card-price{font-size:20px;font-weight:900;color:var(--rsv-primary);letter-spacing:-.02em}
  .rsv-card-price small{font-size:11px;color:var(--rsv-muted);font-weight:600;display:block;letter-spacing:0}
  .rsv-card-cta{background:var(--rsv-primary);color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.02em}
  .rsv-empty{max-width:520px;margin:60px auto;text-align:center;color:var(--rsv-muted);font-size:14px;padding:0 20px}
  .rsv-empty .icon{font-size:48px;margin-bottom:12px}
  .rsv-empty h3{color:var(--rsv-ink);font-size:18px;font-weight:800;margin:0 0 6px}
  .rsv-loading{display:flex;justify-content:center;padding:60px 20px;color:var(--rsv-muted);font-size:13px;gap:8px;align-items:center}
  .rsv-spinner{width:22px;height:22px;border:3px solid #cbd5e1;border-top-color:var(--rsv-primary);border-radius:50%;animation:rsv-spin .8s linear infinite}
  @keyframes rsv-spin{to{transform:rotate(360deg)}}
  #rsv-map-overlay{position:fixed;inset:0;background:#000;z-index:9900;display:none}
  #rsv-map{width:100%;height:100%}
  .rsv-map-close{position:absolute;top:16px;right:16px;z-index:9910;background:#fff;color:var(--rsv-ink);border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);font-weight:900}
  .rsv-map-pin{background:rgba(255,255,255,.92);color:#0f172a;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.25),0 1px 3px rgba(15,23,42,.15);cursor:pointer;white-space:nowrap;border:0;backdrop-filter:blur(4px);transition:all .15s;letter-spacing:-.01em}
  .rsv-map-pin:hover{background:#0f766e;color:#fff;transform:scale(1.08);box-shadow:0 6px 18px rgba(15,118,110,.4)}
  .rsv-map-cluster{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;font-size:11px;font-weight:800;padding:6px 12px 6px 6px;border-radius:999px;box-shadow:0 6px 18px rgba(249,115,22,.35),0 2px 6px rgba(15,23,42,.15);cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .15s;border:2px solid rgba(255,255,255,.5)}
  .rsv-map-cluster:hover{transform:scale(1.08);box-shadow:0 10px 26px rgba(249,115,22,.5)}
  .rsv-map-cluster-count{background:rgba(255,255,255,.28);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;padding:0 6px}
  .rsv-map-cluster-price{font-size:10px;opacity:.95;letter-spacing:.02em;text-transform:uppercase}
  #rsv-spider-overlay{position:absolute;inset:0;pointer-events:none;z-index:900}
  #rsv-spider-overlay svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .rsv-spider-chip{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:opacity .18s,transform .22s cubic-bezier(.34,1.56,.64,1)}
  .rsv-spider-chip.rsv-in{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .rsv-map-card{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(360px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px -8px rgba(0,0,0,.4);overflow:hidden;z-index:9920}
  .rsv-map-card-close{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.9);border:0;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;font-weight:900;color:var(--rsv-ink);box-shadow:0 2px 6px rgba(0,0,0,.15)}
</style>
</head>
<body>
<header class="rsv-topbar">
  <a href="/reservas/" class="rsv-brand"><span class="rsv-brand-icon">📅</span>Check-inn · Reservas</a>
  <a href="https://check-inn-saltillo.com" class="rsv-back">Ir al sitio principal →</a>
</header>
<div id="rsv-shell">
  <div class="rsv-hero">
    <h1 class="rsv-hero-title">Encuentra tu próxima estancia</h1>
    <p class="rsv-hero-sub">Consulta disponibilidad, compara precios y reserva directo.</p>
    <div class="rsv-searchbar">
      <input id="rsv-in-location" type="hidden" value="">
      <div class="rsv-field">
        <label>Llegada</label>
        <input id="rsv-in-arrival" type="date">
      </div>
      <div class="rsv-field">
        <label>Salida</label>
        <input id="rsv-in-departure" type="date">
      </div>
      <div class="rsv-field">
        <label>Huéspedes</label>
        <input id="rsv-in-adults" type="number" min="1" max="20" value="2">
      </div>
      <button type="button" class="rsv-search-btn" onclick="rsvSearch_()">🔍 Buscar</button>
    </div>
  </div>
  <div class="rsv-toolbar" id="rsv-toolbar" style="display:none">
    <div class="rsv-count" id="rsv-count"></div>
  </div>
  <div id="rsv-float-bar" class="rsv-float-bar">
    <button type="button" id="rsv-map-btn-float" class="rsv-map-btn-float" onclick="rsvOpenMap_()">🗺️ Ver mapa</button>
    <button type="button" id="rsv-share-btn" class="rsv-share-btn-float" onclick="rsvShare_(this)" title="Copiar liga con estos resultados">🔗 Compartir</button>
  </div>
  <div id="rsv-results">
    <div class="rsv-empty">
      <div class="icon">🔎</div>
      <h3>Empieza tu búsqueda</h3>
      <div>Elige fechas y número de huéspedes para ver alojamientos disponibles.</div>
    </div>
  </div>
</div>
<div id="rsv-map-overlay">
  <button class="rsv-map-close" onclick="rsvCloseMap_()" title="Cerrar mapa">×</button>
  <div id="rsv-map"></div>
</div>
<script>
window.RSV_STATE = { results: [], map: null, mapMarkers: [] };
function _rsvFmt$(n, cur) {
  try {
    return new Intl.NumberFormat('es-MX', { style: 'currency', currency: cur || 'MXN', maximumFractionDigits: 0 }).format(Number(n) || 0);
  } catch { return `$ ${Math.round(Number(n)||0).toLocaleString('es-MX')}`; }
}
function _rsvEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _rsvSlugify(name) {
  return String(name || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[()]/g, ' ')
    .replace(/[#º°ª]/g, '')
    .replace(/[,.;:!?"']/g, ' ')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}
function _rsvHostedUrl(r, arrival, departure, adults) {
  const a = String(arrival).replace(/-/g, '');
  const d = String(departure).replace(/-/g, '');
  let base = r.hostedUrl;
  if (!base) {
    const slug = _rsvSlugify(r.name);
    base = slug ? `https://check-inn-saltillo.com/es/${slug}` : 'https://check-inn-saltillo.com';
  }
  const sep = base.indexOf('?') >= 0 ? '&' : '?';
  return `${base}${sep}arrival=${a}&departure=${d}&adults=${adults}&children=0&pets=0&infants=0`;
}
window.rsvSearch_ = async function() {
  const loc = document.getElementById('rsv-in-location').value.trim();
  const arrival = document.getElementById('rsv-in-arrival').value;
  const departure = document.getElementById('rsv-in-departure').value;
  const adults = Math.max(1, parseInt(document.getElementById('rsv-in-adults').value, 10) || 2);
  if (!arrival || !departure) { alert('Elige fechas de llegada y salida'); return; }
  if (arrival >= departure) { alert('La fecha de salida debe ser posterior a la de llegada'); return; }
  const cont = document.getElementById('rsv-results');
  const toolbar = document.getElementById('rsv-toolbar');
  toolbar.style.display = 'none';
  cont.innerHTML = `<div class="rsv-loading"><div class="rsv-spinner"></div>Consultando disponibilidad…</div>`;
  try {
    const url = new URL('https://api.check-inn.mx/reservas/search');
    url.searchParams.set('arrival', arrival);
    url.searchParams.set('departure', departure);
    url.searchParams.set('adults', String(adults));
    if (loc) url.searchParams.set('location', loc);
    const r = await fetch(url.toString(), { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Error del servidor');
    RSV_STATE.results = j.results || [];
    RSV_STATE.query = { arrival, departure, adults };
    _rsvRenderResults_();
  } catch (e) {
    cont.innerHTML = `<div class="rsv-empty"><div class="icon">⚠️</div><h3>No pudimos consultar</h3><div>${_rsvEsc(e.message||e)}</div></div>`;
  }
};
function _rsvRenderResults_() {
  const cont = document.getElementById('rsv-results');
  const toolbar = document.getElementById('rsv-toolbar');
  const floatBtn = document.getElementById('rsv-float-bar');
  const results = RSV_STATE.results || [];
  if (!results.length) {
    toolbar.style.display = 'none';
    if (floatBtn) floatBtn.classList.remove('visible');
    cont.innerHTML = `<div class="rsv-empty"><div class="icon">😕</div><h3>Sin disponibilidad</h3><div>No encontramos alojamientos para esas fechas. Prueba otras.</div></div>`;
    return;
  }
  toolbar.style.display = 'flex';
  if (floatBtn) floatBtn.classList.add('visible');
  const q = RSV_STATE.query || {};
  document.getElementById('rsv-count').innerHTML = `${results.length} alojamiento${results.length===1?'':'s'} disponibles <small>· ${q.arrival} → ${q.departure} · ${q.adults} huésped(es)</small>`;
  cont.innerHTML = `<div class="rsv-grid">${results.map((r,i) => _rsvCardHtml_(r,i)).join('')}</div>`;
}
function _rsvCardHtml_(r, idx) {
  const q = RSV_STATE.query || {};
  const link = _rsvHostedUrl(r, q.arrival, q.departure, q.adults);
  const amen = (r.amenities||[]).slice(0,4).map(a=>`<span>${_rsvEsc(a)}</span>`).join('');
  const cap = [];
  if (r.max_people) cap.push(`<span>👥 ${r.max_people}</span>`);
  if (r.bedrooms) cap.push(`<span>🛏 ${r.bedrooms}</span>`);
  if (r.bathrooms) cap.push(`<span>🚿 ${r.bathrooms}</span>`);
  return `<div class="rsv-card" data-rsv-idx="${idx}" onclick="rsvOpenBooking_(${idx})">
    <div class="rsv-card-img">
      ${r.type ? `<div class="rsv-card-type">${_rsvEsc(r.type)}</div>` : ''}
      ${r.image ? `<img src="${_rsvEsc(r.image)}" alt="${_rsvEsc(r.name)}" loading="lazy">` : ''}
    </div>
    <div class="rsv-card-body">
      <h3 class="rsv-card-title">${_rsvEsc(r.name)}</h3>
      <p class="rsv-card-loc">📍 ${_rsvEsc(r.city || r.address || 'Saltillo')}</p>
      ${cap.length ? `<div class="rsv-card-cap">${cap.join('')}</div>` : ''}
      ${amen ? `<div class="rsv-card-amen">${amen}</div>` : ''}
      <div class="rsv-card-foot">
        <div class="rsv-card-price">${_rsvFmt$(r.total, r.currency)}<small>${r.nights} noche${r.nights===1?'':'s'} · total</small></div>
        <span class="rsv-card-cta">Reservar →</span>
      </div>
    </div>
  </div>`;
}
window.rsvOpenBooking_ = function(idx) {
  const r = (RSV_STATE.results || [])[idx];
  if (!r) return;
  const q = RSV_STATE.query || {};
  const url = _rsvHostedUrl(r, q.arrival, q.departure, q.adults);
  window.open(url, '_blank', 'noopener');
};
window.rsvOpenMap_ = function() {
  _rsvEnsureLeaflet_(() => {
    document.getElementById('rsv-map-overlay').style.display = 'block';
    setTimeout(_rsvRenderMap_, 60);
  });
};
window.rsvCloseMap_ = function() {
  const el = document.querySelector('.rsv-map-card'); if (el) el.remove();
  document.getElementById('rsv-map-overlay').style.display = 'none';
};
function _rsvEnsureLeaflet_(cb) {
  if (window.L) return cb();
  const css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  const js = document.createElement('script');
  js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  js.onload = cb;
  document.head.appendChild(js);
}
function _rsvRenderMap_() {
  const results = (RSV_STATE.results || []).filter(r => r.latitude && r.longitude);
  if (RSV_STATE.map) { RSV_STATE.map.remove(); RSV_STATE.map = null; }
  const first = results[0] || { latitude: 25.4232, longitude: -100.9906 };
  const map = L.map('rsv-map').setView([first.latitude, first.longitude], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap',
  }).addTo(map);
  RSV_STATE.mapResults = results;
  RSV_STATE.mapMarkers = [];
  const bounds = results.map(r => [r.latitude, r.longitude]);
  if (bounds.length > 1) map.fitBounds(bounds, { padding: [60, 60] });
  RSV_STATE.map = map;
  map.on('zoomend', _rsvRebuildMapMarkers_);
  map.on('movestart zoomstart', _rsvSpiderCollapse_);
  setTimeout(_rsvRebuildMapMarkers_, 60);
}
function _rsvRebuildMapMarkers_() {
  const map = RSV_STATE.map; if (!map) return;
  const results = RSV_STATE.mapResults || [];
  (RSV_STATE.mapMarkers || []).forEach(m => { try { map.removeLayer(m); } catch(_) {} });
  RSV_STATE.mapMarkers = [];
  _rsvSpiderCollapse_();
  const THRESH = 52;
  const pts = results.map((r, i) => ({ i, r, px: map.latLngToLayerPoint([r.latitude, r.longitude]) }));
  const seen = new Set(); const groups = [];
  for (const p of pts) {
    if (seen.has(p.i)) continue;
    const g = [p.i]; seen.add(p.i);
    for (const q of pts) {
      if (seen.has(q.i)) continue;
      const dx = p.px.x - q.px.x, dy = p.px.y - q.px.y;
      if (dx*dx + dy*dy < THRESH*THRESH) { g.push(q.i); seen.add(q.i); }
    }
    groups.push(g);
  }
  groups.forEach(g => {
    if (g.length === 1) {
      const idx = g[0]; const r = results[idx];
      const icon = L.divIcon({ className:'', html:`<div class="rsv-map-pin">${_rsvFmt$(r.total, r.currency)}</div>`, iconSize:[80,30], iconAnchor:[40,30] });
      const m = L.marker([r.latitude, r.longitude], { icon }).addTo(map);
      m.on('click', () => _rsvShowMapCard_(idx));
      RSV_STATE.mapMarkers.push(m);
    } else {
      const cLat = g.reduce((s,i) => s + results[i].latitude, 0) / g.length;
      const cLng = g.reduce((s,i) => s + results[i].longitude, 0) / g.length;
      const minT = Math.min(...g.map(i => Number(results[i].total) || Infinity));
      const cur = results[g[0]].currency || 'MXN';
      const html = `<div class="rsv-map-cluster"><span class="rsv-map-cluster-count">${g.length}</span><span class="rsv-map-cluster-price">desde ${_rsvFmt$(minT, cur)}</span></div>`;
      const icon = L.divIcon({ className:'', html, iconSize:[120,36], iconAnchor:[60,18] });
      const m = L.marker([cLat, cLng], { icon }).addTo(map);
      const hook = () => {
        const el = m.getElement() && m.getElement().querySelector('.rsv-map-cluster');
        if (!el) return;
        el.addEventListener('mouseenter', () => _rsvSpiderExpand_(g, [cLat, cLng]));
      };
      m.on('add', hook); if (m.getElement()) hook();
      RSV_STATE.mapMarkers.push(m);
    }
  });
}
function _rsvSpiderCollapse_() {
  const ov = document.getElementById('rsv-spider-overlay');
  if (ov) ov.remove();
  if (RSV_STATE._spiderCleanup) { try { RSV_STATE._spiderCleanup(); } catch(_) {} RSV_STATE._spiderCleanup = null; }
}
function _rsvSpiderExpand_(indices, centerLatLng) {
  _rsvSpiderCollapse_();
  const map = RSV_STATE.map; if (!map) return;
  const results = RSV_STATE.mapResults || [];
  const mapEl = document.getElementById('rsv-map');
  const centerPx = map.latLngToContainerPoint(centerLatLng);
  const N = indices.length;
  const R = 70 + N * 8;
  const ov = document.createElement('div');
  ov.id = 'rsv-spider-overlay';
  ov.innerHTML = `<svg><g id="rsv-spider-lines"></g></svg>`;
  mapEl.appendChild(ov);
  const svg = ov.querySelector('#rsv-spider-lines');
  indices.forEach((idx, k) => {
    const angle = -Math.PI/2 + (2*Math.PI/N)*k;
    const x = centerPx.x + Math.cos(angle) * R;
    const y = centerPx.y + Math.sin(angle) * R;
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', centerPx.x); ln.setAttribute('y1', centerPx.y);
    ln.setAttribute('x2', x); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', 'rgba(15,23,42,.55)');
    ln.setAttribute('stroke-width', '1.5');
    ln.setAttribute('stroke-dasharray', '3 4');
    ln.setAttribute('stroke-linecap', 'round');
    svg.appendChild(ln);
    const r = results[idx];
    const chip = document.createElement('div');
    chip.className = 'rsv-spider-chip';
    chip.style.left = x + 'px'; chip.style.top = y + 'px';
    chip.innerHTML = `<div class="rsv-map-pin">${_rsvFmt$(r.total, r.currency)}</div>`;
    chip.onclick = () => _rsvShowMapCard_(idx);
    ov.appendChild(chip);
    requestAnimationFrame(() => chip.classList.add('rsv-in'));
  });
  const onMove = (ev) => {
    const rect = mapEl.getBoundingClientRect();
    const lx = ev.clientX - rect.left, ly = ev.clientY - rect.top;
    const dx = lx - centerPx.x, dy = ly - centerPx.y;
    if (Math.sqrt(dx*dx + dy*dy) > R + 55) _rsvSpiderCollapse_();
  };
  mapEl.addEventListener('mousemove', onMove);
  RSV_STATE._spiderCleanup = () => mapEl.removeEventListener('mousemove', onMove);
}
function _rsvShowMapCard_(idx) {
  const r = (RSV_STATE.results || [])[idx]; if (!r) return;
  const existing = document.querySelector('.rsv-map-card');
  if (existing) existing.remove();
  const q = RSV_STATE.query || {};
  const el = document.createElement('div');
  el.className = 'rsv-map-card';
  el.innerHTML = `
    <button class="rsv-map-card-close" onclick="this.parentElement.remove()">×</button>
    ${r.image ? `<img src="${_rsvEsc(r.image)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block">` : ''}
    <div style="padding:12px 14px 14px">
      <div style="font-size:14px;font-weight:800;color:#0f172a;margin-bottom:2px">${_rsvEsc(r.name)}</div>
      <div style="font-size:11px;color:#64748b;margin-bottom:10px">${_rsvEsc(r.type || 'Alojamiento')} · 📍 ${_rsvEsc(r.city || 'Saltillo')}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:18px;font-weight:900;color:#0f766e;letter-spacing:-.02em">${_rsvFmt$(r.total, r.currency)}</div>
          <div style="font-size:10px;color:#64748b">${r.nights} noche${r.nights===1?'':'s'} · total</div>
        </div>
        <button onclick="rsvOpenBooking_(${idx})" style="background:#0f766e;color:#fff;border:0;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer">Reservar →</button>
      </div>
    </div>`;
  document.body.appendChild(el);
}
window.rsvShare_ = async function(btn) {
  const q = RSV_STATE.query || {};
  if (!q.arrival || !q.departure) { alert('Primero haz una búsqueda para poder compartir sus resultados.'); return; }
  const url = new URL(location.href);
  ['rsv_arrival','rsv_departure','rsv_adults','rsv_go'].forEach(k => url.searchParams.delete(k));
  url.searchParams.set('rsv_arrival', q.arrival);
  url.searchParams.set('rsv_departure', q.departure);
  url.searchParams.set('rsv_adults', String(q.adults || 2));
  url.searchParams.set('rsv_go', '1');
  const fmt = s => {
    try {
      const [y,m,d] = s.split('-').map(Number);
      return new Date(y, m-1, d).toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' });
    } catch(_) { return s; }
  };
  const n = q.adults || 2;
  const texto = `Resultados de búsqueda del ${fmt(q.arrival)} al ${fmt(q.departure)} para ${n} ${n===1?'persona':'personas'}:\n${url.toString()}`;
  try {
    await navigator.clipboard.writeText(texto);
    if (btn) {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 1800);
    }
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = texto; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); alert('Copiado al portapapeles'); } catch(_) { prompt('Copia manualmente:', texto); }
    ta.remove();
  }
};
// Init: prellenar fechas default (hoy + 2 días) o desde query params.
// Deep-link: ?rsv_arrival=YYYY-MM-DD&rsv_departure=YYYY-MM-DD&rsv_adults=N[&rsv_go=1]
(function _rsvInit_(){
  document.addEventListener('DOMContentLoaded', () => {
    const a = document.getElementById('rsv-in-arrival');
    const d = document.getElementById('rsv-in-departure');
    const ad = document.getElementById('rsv-in-adults');
    const qs = new URLSearchParams(location.search);
    const qA = qs.get('rsv_arrival'), qD = qs.get('rsv_departure'), qAd = qs.get('rsv_adults');
    const isValidDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
    if (a && isValidDate(qA) && isValidDate(qD)) {
      a.value = qA;
      if (d) d.value = qD;
      if (ad && qAd) ad.value = String(Math.max(1, parseInt(qAd, 10) || 2));
    } else if (a && !a.value) {
      const t = new Date();
      a.value = t.toISOString().slice(0,10);
      const t2 = new Date(t); t2.setDate(t2.getDate()+2);
      if (d) d.value = t2.toISOString().slice(0,10);
    }
    if (qs.get('rsv_go') === '1' && isValidDate(qA) && isValidDate(qD)) {
      setTimeout(() => { try { window.rsvSearch_(); } catch(_) {} }, 200);
    }
  });
})();
</script>
