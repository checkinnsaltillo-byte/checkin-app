name: Sync guías (JSON estático)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-guias
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerar JSONs
        run: node scripts/sync-guias.cjs

      - name: Commit si cambió algo
        run: |
          git config user.name  "check-inn-bot"
          git config user.email "bot@check-inn.mx"
          git add public/guia/data/
          if git diff --cached --quiet; then
            echo "sin cambios — no commit"
          else
            git commit -m "chore(guias): snapshot horario JSON $(date -u +%FT%TZ)"
            git push origin main
          fi
